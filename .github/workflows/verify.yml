name: Verify Little Days

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check game/engine.js
          node --check game/engine-v25.js
          node --check game/engine-v26.js
          node --check game/engine-v27.js
          node --check game/engine-v28.js
          node --check game/engine-v29.js
          node --check game/content.js
          node --check game/callbacks.js
          node --check game/realism.js
          node --check game/realism-v2.js
          node --check game/contextual-events.js
          node --check game/contextual-events-v2.js
          node --check game/household-membership.js
          node --check game/childhood-v2.js
          node --check game/childhood-v3.js
          node --check game/childhood-v4.js
          node --check game/childhood-v5.js
          node --check game/childhood-v6.js
          node --check game/childhood-v2-resolve.js
          node --check game/childhood-v3-resolve.js
          node --check game/childhood-v4-resolve.js
          node --check game/childhood-v5-resolve.js
          node --check game/relationship-continuity.js
          node --check game/school-coherence.js
          node --check game/family-enhancer.js
          node --check game/life-enhancer.js
          node --check game/psychology.js
          node --check game/psychology-phase2.js
          node --check game/psychology-phase3.js
          node --check game/psychology-events.js
          node --check game/psychology-events-v2.js
          node --check game/psychology-phase3-loader.js
          node --check game/childhood-summary.js
          node --check game/childhood-summary-loader.js
          node --check tests/realism-smoke.mjs
          node --check tests/illness-coherence-smoke.mjs
          node --check tests/contextual-events-smoke.mjs
          node --check tests/household-membership-smoke.mjs
          node --check tests/childhood-v2-smoke.mjs
          node --check tests/school-social-100-life.mjs
          node --check tests/psychology-phase1-smoke.mjs
          node --check tests/psychology-phase2-smoke.mjs
          node --check tests/psychology-phase3-smoke.mjs
          node --check tests/psychology-events-smoke.mjs
          node --check tests/early-childhood-variety-smoke.mjs
          node --check tests/friendship-continuity-smoke.mjs
          node --check tests/relationship-continuity-v2-smoke.mjs
          node --check tests/school-coherence-smoke.mjs
          node --check tests/childhood-summary-smoke.mjs
      - name: Smoke test living household
        run: node tests/realism-smoke.mjs
      - name: Smoke test illness and school coherence
        run: node tests/illness-coherence-smoke.mjs
      - name: Smoke test contextual life loop
        run: node tests/contextual-events-smoke.mjs
      - name: Smoke test household membership
        run: node tests/household-membership-smoke.mjs
      - name: Smoke test childhood social world
        run: node tests/childhood-v2-smoke.mjs
      - name: Smoke test psychological development phase 1
        run: node tests/psychology-phase1-smoke.mjs
      - name: Smoke test psychological development phase 2
        run: node tests/psychology-phase2-smoke.mjs
      - name: Smoke test psychological development phase 3
        run: node tests/psychology-phase3-smoke.mjs
      - name: Smoke test psychology-aware events
        run: node tests/psychology-events-smoke.mjs
      - name: Smoke test early-childhood variety
        run: node tests/early-childhood-variety-smoke.mjs
      - name: Smoke test friendship continuity
        run: node tests/friendship-continuity-smoke.mjs
      - name: Smoke test relationship continuity v2
        run: node tests/relationship-continuity-v2-smoke.mjs
      - name: Smoke test school coherence
        run: node tests/school-coherence-smoke.mjs
      - name: Smoke test age 13 childhood summary
        run: node tests/childhood-summary-smoke.mjs
      - name: Simulate 100 school-age lives
        run: node tests/school-social-100-life.mjs
