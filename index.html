<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e8" />
  <meta name="description" content="Little Days — a quiet, story-first life simulation." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=13" />
  <link rel="stylesheet" href="./setup.css?v=13" />
  <title>Little Days</title>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <noscript><div style="padding:20px;text-align:center">Little Days needs JavaScript enabled to begin a life.</div></noscript>
<script>
(function(){
  "use strict";
  var KEY="little-days-save-v2";
  var FIRST=["Mara","Elio","Sofia","Nico","Lia","Tomas","Iris","Paolo","Mina","Theo"];
  var LAST=["Reyes","Santos","Garcia","Navarro","Cruz","Mendoza","Flores","Ramos"];
  var WOMEN=["Ana","Elena","Maria","Grace","Isabel","Teresa","Liza","Joy","Rina","Carmen"];
  var MEN=["Paolo","Daniel","Luis","Marco","Ramon","Miguel","Andres","Carlo","Ben","Joel"];
  var FRIEND=["Maya","Liam","Zoe","Nina","Eli","Sam","Noah","Aya"];
  var SIB=["Leo","Mika","Nina","Gab","Tala","Enzo","Maya","Luis","Inez","Joaquin"];
  var LOLA=["Lola Cora","Lola Tess","Lola Nena","Lola Mila","Lola Fe","Lola Rosa"];
  var LOLO=["Lolo Tony","Lolo Nestor","Lolo Lito","Lolo Jose","Lolo Mario","Lolo Ben"];
  var PLACES=[
    {city:"Quezon City",country:"Philippines",neighborhood:"Busy",housing:"Small two-bedroom house"},
    {city:"Imus",country:"Philippines",neighborhood:"Growing",housing:"Modest townhouse"},
    {city:"Iloilo City",country:"Philippines",neighborhood:"Quiet",housing:"Two-bedroom apartment"},
    {city:"Cebu City",country:"Philippines",neighborhood:"Busy",housing:"Compact apartment"},
    {city:"Davao City",country:"Philippines",neighborhood:"Residential",housing:"Small family house"}
  ];
  function rng(seed){var v=seed>>>0;return function(){v=(v*1664525+1013904223)>>>0;return v/4294967296}}
  function pick(r,a){return a[Math.floor(r()*a.length)]}
  function n(r,a,b){return Math.round(a+r()*(b-a))}
  function rel(r,role,name,age,intro,label,sex){return{id:role+"-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-"),role:role,name:name,age:age,introducedAtMonths:intro||0,relationshipLabel:label||role,sex:sex||null,closeness:n(r,48,72),trust:n(r,48,72),affection:n(r,55,78),conflict:n(r,5,20),familiarity:n(r,50,72),lastInteractionAtMonths:intro||0,history:[],npc:{outsideStress:n(r,20,48),availability:n(r,58,82),socialWorld:n(r,28,64),currentThread:"",lastChangedAtMonths:0}}}
  function siblingCount(r){var x=r();return x<.42?0:x<.76?1:x<.93?2:3}
  function buildFamily(r,last){
    var people=[],story="",roll=r(),mother=pick(r,WOMEN)+" "+last,father=pick(r,MEN)+" "+last,otherLast=pick(r,LAST),stepmother=pick(r,WOMEN)+" "+otherLast,stepfather=pick(r,MEN)+" "+otherLast;
    function add(role,name,age,label,sex){var p=rel(r,role,name,age,0,label,sex);people.push(p);return p}
    if(roll<.34){add("guardian",mother,n(r,24,37),"Mother","Female");add("secondGuardian",father,n(r,25,40),"Father","Male");story="You were born to "+mother+" and "+father+", who are raising you together."}
    else if(roll<.46){add("guardian",mother,n(r,25,38),"Mother","Female");add("secondGuardian",stepfather,n(r,27,42),"Stepfather","Male");story="Your biological father died before you were born. Your mother, "+mother+", is raising you with her husband, "+stepfather+"."}
    else if(roll<.56){add("guardian",father,n(r,26,40),"Father","Male");add("secondGuardian",stepmother,n(r,25,39),"Stepmother","Female");story="Your biological mother died before you were born. Your father, "+father+", is raising you with his wife, "+stepmother+"."}
    else if(roll<.66){add("guardian",mother,n(r,23,38),"Mother","Female");story="Your parents separated before you were born. Your mother, "+mother+", is your only parent at home; your father lives elsewhere."}
    else if(roll<.76){add("guardian",father,n(r,24,40),"Father","Male");story=r()<.3?"Your parents' relationship ended after your mother became involved with someone else. You live with your father, "+father+", who is raising you on his own.":"Your mother is not part of your household. You live with your father, "+father+", who is raising you on his own."}
    else if(roll<.86){add("guardian",pick(r,WOMEN)+" "+last,n(r,28,42),"Adoptive mother","Female");add("secondGuardian",pick(r,MEN)+" "+last,n(r,29,44),"Adoptive father","Male");story="You were adopted at birth. The two people taking you home are your adoptive parents."}
    else if(roll<.91){var aunt=pick(r,WOMEN)+" "+last,uncle=pick(r,MEN)+" "+last;add("guardian",aunt,n(r,29,45),"Aunt / guardian","Female");add("secondGuardian",uncle,n(r,30,47),"Uncle / guardian","Male");story="Your biological parents cannot care for you, so you are being raised by your aunt, "+aunt+", and uncle, "+uncle+"."}
    else if(roll<.97){var gm=pick(r,LOLA),gf=pick(r,LOLO);add("guardian",gm,n(r,54,69),"Grandmother / guardian","Female");add("secondGuardian",gf,n(r,56,73),"Grandfather / guardian","Male");story="Your parents are not able to raise you. From the beginning, "+gm+" and "+gf+" are the people bringing you home."}
    else {var fm=pick(r,WOMEN)+" "+last,ff=pick(r,MEN)+" "+last;add("guardian",fm,n(r,29,43),"Foster mother","Female");add("secondGuardian",ff,n(r,30,45),"Foster father","Male");story=r()<.45?"You were found abandoned shortly after birth, alive in a rubbish bin. After emergency care, you were placed with foster parents "+fm+" and "+ff+".":"You were abandoned shortly after birth and entered foster care. "+fm+" and "+ff+" are the first parents you know."}

    var count=siblingCount(r),sibNames=[];
    for(var i=0;i<count;i++){var sn=pick(r,SIB)+" "+last;while(sibNames.indexOf(sn)>=0)sn=pick(r,SIB)+" "+last;sibNames.push(sn);add("sibling",sn,n(r,1,8),i===0?"Sibling":"Sibling","Male")}
    var siblingText=count===0?"You are an only child.":count===1?"You have one sibling, "+sibNames[0]+".":"You have "+count+" siblings: "+sibNames.join(", ")+".";

    var extended=[];
    if(r()<.67){var lg=pick(r,LOLA);add("grandmother",lg,n(r,52,72),"Grandmother","Female");extended.push(lg)}
    if(r()<.58){var lo=pick(r,LOLO);add("grandfather",lo,n(r,54,76),"Grandfather","Male");extended.push(lo)}
    var auntCount=r()<.55?n(r,1,2):0,uncleCount=r()<.5?n(r,1,2):0;
    for(i=0;i<auntCount;i++){var an="Auntie "+pick(r,WOMEN);add("aunt",an+" "+pick(r,LAST),n(r,24,48),"Aunt","Female");extended.push(an)}
    for(i=0;i<uncleCount;i++){var un="Uncle "+pick(r,MEN);add("uncle",un+" "+pick(r,LAST),n(r,25,50),"Uncle","Male");extended.push(un)}
    var cousins=(auntCount+uncleCount)&&r()<.72?n(r,1,4):0;
    for(i=0;i<cousins;i++){add("cousin",pick(r,SIB)+" "+pick(r,LAST),n(r,1,12),"Cousin",r()>.5?"Female":"Male")}
    var extendedText=extended.length?"Beyond your home, your family already includes "+extended.join(", ")+(cousins?", and "+cousins+" cousin"+(cousins===1?"":"s")+".":"."):"Your extended family is small or distant at the start of your life.";
    return{people:people,story:story,siblingText:siblingText,extendedText:extendedText};
  }
  function makeLife(){
    var seed=(Date.now()^Math.floor(Math.random()*0x7fffffff))>>>0,r=rng(seed||1),first=pick(r,FIRST),last=pick(r,LAST),place=pick(r,PLACES),financeRoll=r(),band=financeRoll<.28?"Tight":financeRoll<.76?"Getting by":"Comfortable",month=n(r,0,11),family=buildFamily(r,last);
    var personality={social:n(r,38,62),risk:n(r,38,62),structure:n(r,38,62),sensitivity:n(r,38,62),curiosity:n(r,42,68),independence:n(r,35,58)};
    var people=family.people.concat([rel(r,"friend",pick(r,FRIEND)+" "+pick(r,LAST),0,60,"Friend"),rel(r,"teacher",pick(r,["Ms. Santos","Mr. Lim","Ms. Rivera","Mr. Cruz"]),n(r,27,49),60,"Teacher")]);
    var householdSize=family.people.filter(function(p){return p.role==="guardian"||p.role==="secondGuardian"||p.role==="sibling"}).length;
    return{version:2,seed:seed||1,rngState:(seed||1)^0x9e3779b9,character:{firstName:first,lastName:last,sex:r()>.5?"Female":"Male",birthplace:place.city+", "+place.country,ageMonths:0,birthYear:2026,birthMonth:month,personality:personality},date:{year:2026,month:month,day:n(r,3,25)},household:{name:"The "+last+" Family Home",housing:place.housing,city:place.city,country:place.country,neighborhood:place.neighborhood,financeBand:band,privacy:householdSize>=4?"Limited":"Moderate",comfort:band==="Comfortable"?"Comfortable":band==="Tight"?"Basic":"Modest",savings:band==="Comfortable"?n(r,30000,90000):band==="Tight"?n(r,0,5000):n(r,6000,25000)},family:{originStory:family.story,siblingSummary:family.siblingText,extendedSummary:family.extendedText},health:{wellbeing:n(r,64,82),energy:n(r,62,82),stress:n(r,12,28)},interests:{drawing:n(r,15,30),reading:n(r,15,30),gardening:n(r,10,24),cooking:n(r,10,24),gaming:n(r,10,24),music:n(r,10,24),making:n(r,15,30)},education:{subjects:{mathematics:n(r,42,62),language:n(r,42,62),science:n(r,42,62),art:n(r,42,62),physicalEducation:n(r,42,62)}},money:{savings:0},people:people,memories:[],history:[],worldEvents:[],recentEventIds:[],currentEventId:"held_after_crying",resolution:null,completed:false};
  }
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  function read(){try{var x=JSON.parse(localStorage.getItem(KEY));return x&&x.version===2&&x.character&&x.household?x:null}catch(e){return null}}
  function clean(x){return String(x||"").trim().replace(/[^A-Za-zÀ-ÖØ-öø-ÿ' -]/g,"").replace(/\s+/g," ").slice(0,28)}
  function shell(html){document.getElementById("app").innerHTML='<section class="setup-screen">'+html+'</section>'}
  function choice(){shell('<div class="setup-header"><p class="brand">Little Days</p><h1>Begin a life</h1><p>Every life starts with things you choose and things you don\'t.</p></div><div class="setup-options"><button class="setup-option" onclick="LittleDaysStart.random()"><strong>Random life</strong><span>Let everything be generated, including your character.</span></button><button class="setup-option" onclick="LittleDaysStart.custom()"><strong>Custom character</strong><span>Choose your character\'s identity. Their family history, money, home, birthplace, temperament, health risks, and circumstances are still generated.</span></button></div><p class="setup-footnote">You can choose the person. You cannot choose the life waiting for them.</p>')}
  function custom(){shell('<div class="setup-header compact"><p class="brand">Little Days</p><h1>Create your character</h1><p>You choose who the character is. You do not choose the world they are born into.</p></div><form class="custom-form" id="custom-form"><label><span>First name</span><input name="first" required maxlength="28"></label><label><span>Last name</span><input name="last" required maxlength="28"></label><label><span>Identity</span><select name="sex"><option>Female</option><option>Male</option><option>Non-binary</option></select></label><div class="setup-note"><strong>Still generated</strong><p>Family history, siblings, relatives, finances, home, birthplace, temperament, abilities, health, and future opportunities.</p></div><button class="setup-primary" type="submit">Create this life</button><button class="setup-secondary" type="button" onclick="LittleDaysStart.choice()">Back</button></form>');document.getElementById("custom-form").onsubmit=function(e){e.preventDefault();var d=new FormData(e.target),f=clean(d.get("first")),l=clean(d.get("last"));if(!f||!l)return;begin("custom",{first:f,last:l,sex:d.get("sex")})}}
  function customize(life,d){life.character.firstName=d.first;life.character.lastName=d.last;life.character.sex=d.sex;life.household.name="The "+d.last+" Family Home"}
  function date(life){return["January","February","March","April","May","June","July","August","September","October","November","December"][life.date.month]+" "+life.date.day+", "+life.date.year}
  function intro(life){var line=life.startMode==="custom"?"You chose your character. You did not choose the circumstances waiting for them.":"You did not choose who you would be or the circumstances waiting for you.";var f=life.family||{};var origin=f.originStory||"Your family story is already in motion.";var siblings=f.siblingSummary||"Your place among siblings is still becoming clear.";var extended=f.extendedSummary||"Your extended family will reveal itself as you grow.";shell('<div class="birth-intro"><p class="brand">Little Days</p><p class="birth-kicker">A new life</p><h1>You were born.</h1><p class="birth-date">'+date(life)+'</p><div class="birth-rule"></div><p class="birth-copy">Your name is <strong>'+life.character.firstName+' '+life.character.lastName+'</strong>. You were born in '+life.character.birthplace+'.</p><p class="birth-copy">'+origin+'</p><p class="birth-copy">'+siblings+' '+extended+'</p><p class="birth-copy">You begin life in a '+life.household.housing.toLowerCase()+' in '+life.household.city+'. Money in the household is <strong>'+life.household.financeBand.toLowerCase()+'</strong>, and the neighborhood is '+life.household.neighborhood.toLowerCase()+'.</p><div class="birth-rule"></div><p class="birth-philosophy">'+line+'</p><p class="birth-philosophy">You will discover the rest by living.</p><button class="setup-primary" onclick="LittleDaysStart.play()">Begin</button></div>')}
  function begin(mode,data){var life=makeLife();if(mode==="custom")customize(life,data);life.startMode=mode;life.introPending=true;save(life);intro(life)}
  function normalize(life){if(!life||life.character.ageMonths>=36||life.currentEventId!=="family_evening")return;life.resolution=null;life.currentEventId=life.character.ageMonths<12?"held_after_crying":life.character.ageMonths<24?"cupboard_discovery":"playground_edge"}
  function error(msg){shell('<div class="setup-header"><p class="brand">Little Days</p><h1>Something didn\'t load.</h1><p>'+msg+'</p></div><button class="setup-primary" onclick="location.reload()">Reload</button>')}
  function play(){var life=read();if(!life){choice();return}life.introPending=false;normalize(life);save(life);shell('<div class="setup-header"><p class="brand">Little Days</p><h1>Opening your life…</h1><p>One moment.</p></div>');var done=false;import("./app.js?v=16").then(function(game){if(game&&typeof game.initializeApp==="function")game.initializeApp();done=true}).catch(function(){done=true;error("The life was saved, but the game screen could not open. Reload once to try again.")});setTimeout(function(){if(!done||!document.querySelector(".screen"))error("The game took too long to open. Your life is saved, so reloading will not erase it.")},4000)}
  window.LittleDaysStart={random:function(){begin("random")},custom:custom,choice:choice,play:play};
  document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-new-life]");if(!b)return;e.preventDefault();e.stopPropagation();if(confirm("Begin a different life? Your current childhood will be replaced.")){localStorage.removeItem(KEY);choice();scrollTo(0,0)}},true);
  var existing=read();if(existing){normalize(existing);save(existing);existing.introPending?intro(existing):play()}else choice();
})();
</script>
</body>
</html>
