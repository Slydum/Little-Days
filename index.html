<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e8" />
  <meta name="description" content="Little Days — a quiet, story-first life simulation." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=11" />
  <link rel="stylesheet" href="./setup.css?v=11" />
  <title>Little Days</title>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <noscript><div style="padding:20px;text-align:center">Little Days needs JavaScript enabled to begin a life.</div></noscript>
<script>
(function(){
  "use strict";
  var KEY="little-days-save-v2";
  var FIRST=["Mara","Elio","Sofia","Nico","Lia","Tomas","Iris","Paolo","Mina","Theo"];
  var LAST=["Reyes","Santos","Garcia","Navarro","Cruz","Mendoza","Flores","Ramos"];
  var ADULT=["Ana","Elena","Maria","Grace","Paolo","Daniel","Luis","Marco"];
  var FRIEND=["Maya","Liam","Zoe","Nina","Eli","Sam","Noah","Aya"];
  var SIB=["Leo","Mika","Nina","Gab","Tala","Enzo"];
  var LOLA=["Lola Cora","Lola Tess","Lola Nena","Lola Mila"];
  var PLACES=[
    {city:"Quezon City",country:"Philippines",neighborhood:"Busy",housing:"Small two-bedroom house"},
    {city:"Imus",country:"Philippines",neighborhood:"Growing",housing:"Modest townhouse"},
    {city:"Iloilo City",country:"Philippines",neighborhood:"Quiet",housing:"Two-bedroom apartment"},
    {city:"Cebu City",country:"Philippines",neighborhood:"Busy",housing:"Compact apartment"},
    {city:"Davao City",country:"Philippines",neighborhood:"Residential",housing:"Small family house"}
  ];
  function rng(seed){var v=seed>>>0;return function(){v=(v*1664525+1013904223)>>>0;return v/4294967296}}
  function pick(r,a){return a[Math.floor(r()*a.length)]}
  function n(r,a,b){return Math.round(a+r()*(b-a))}
  function rel(r,role,name,age,intro){return{id:role+"-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-"),role:role,name:name,age:age,introducedAtMonths:intro||0,closeness:n(r,48,72),trust:n(r,48,72),affection:n(r,55,78),conflict:n(r,5,20),familiarity:n(r,50,72),lastInteractionAtMonths:intro||0,history:[],npc:{outsideStress:n(r,20,48),availability:n(r,58,82),socialWorld:n(r,28,64),currentThread:"",lastChangedAtMonths:0}}}
  function makeLife(){
    var seed=(Date.now()^Math.floor(Math.random()*0x7fffffff))>>>0,r=rng(seed||1),first=pick(r,FIRST),last=pick(r,LAST),place=pick(r,PLACES),two=r()>.28,hasSibling=r()>.42,hasGrandmother=r()>.2,financeRoll=r(),band=financeRoll<.28?"Tight":financeRoll<.76?"Getting by":"Comfortable",month=n(r,0,11);
    var personality={social:n(r,38,62),risk:n(r,38,62),structure:n(r,38,62),sensitivity:n(r,38,62),curiosity:n(r,42,68),independence:n(r,35,58)};
    var people=[rel(r,"guardian",pick(r,ADULT)+" "+last,n(r,24,36),0),rel(r,"friend",pick(r,FRIEND)+" "+pick(r,LAST),0,60),rel(r,"teacher",pick(r,["Ms. Santos","Mr. Lim","Ms. Rivera","Mr. Cruz"]),n(r,27,49),60)];
    if(two)people.push(rel(r,"secondGuardian",pick(r,ADULT)+" "+last,n(r,25,39),0));
    if(hasSibling)people.push(rel(r,"sibling",pick(r,SIB)+" "+last,n(r,2,5),0));
    if(hasGrandmother)people.push(rel(r,"grandmother",pick(r,LOLA),n(r,52,69),0));
    return{version:2,seed:seed||1,rngState:(seed||1)^0x9e3779b9,character:{firstName:first,lastName:last,sex:r()>.5?"Female":"Male",birthplace:place.city+", "+place.country,ageMonths:0,birthYear:2026,birthMonth:month,personality:personality},date:{year:2026,month:month,day:n(r,3,25)},household:{name:"The "+last+" Family Home",housing:place.housing,city:place.city,country:place.country,neighborhood:place.neighborhood,financeBand:band,privacy:two&&hasSibling?"Limited":"Moderate",comfort:band==="Comfortable"?"Comfortable":band==="Tight"?"Basic":"Modest",savings:band==="Comfortable"?n(r,30000,90000):band==="Tight"?n(r,0,5000):n(r,6000,25000)},health:{wellbeing:n(r,64,82),energy:n(r,62,82),stress:n(r,12,28)},interests:{drawing:n(r,15,30),reading:n(r,15,30),gardening:n(r,10,24),cooking:n(r,10,24),gaming:n(r,10,24),music:n(r,10,24),making:n(r,15,30)},education:{subjects:{mathematics:n(r,42,62),language:n(r,42,62),science:n(r,42,62),art:n(r,42,62),physicalEducation:n(r,42,62)}},money:{savings:0},people:people,memories:[],history:[],worldEvents:[],recentEventIds:[],currentEventId:"held_after_crying",resolution:null,completed:false};
  }
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  function read(){try{var x=JSON.parse(localStorage.getItem(KEY));return x&&x.version===2&&x.character&&x.household?x:null}catch(e){return null}}
  function clean(x){return String(x||"").trim().replace(/[^A-Za-zÀ-ÖØ-öø-ÿ' -]/g,"").replace(/\s+/g," ").slice(0,28)}
  function shell(html){document.getElementById("app").innerHTML='<section class="setup-screen">'+html+'</section>'}
  function choice(){shell('<div class="setup-header"><p class="brand">Little Days</p><h1>Begin a life</h1><p>Every life starts with things you choose and things you don\'t.</p></div><div class="setup-options"><button class="setup-option" onclick="LittleDaysStart.random()"><strong>Random life</strong><span>Let everything be generated, including your character.</span></button><button class="setup-option" onclick="LittleDaysStart.custom()"><strong>Custom character</strong><span>Choose your character\'s identity. Their family, money, home, birthplace, temperament, health risks, and circumstances are still generated.</span></button></div><p class="setup-footnote">You can choose the person. You cannot choose the life waiting for them.</p>')}
  function custom(){shell('<div class="setup-header compact"><p class="brand">Little Days</p><h1>Create your character</h1><p>You choose who the character is. You do not choose the world they are born into.</p></div><form class="custom-form" id="custom-form"><label><span>First name</span><input name="first" required maxlength="28"></label><label><span>Last name</span><input name="last" required maxlength="28"></label><label><span>Identity</span><select name="sex"><option>Female</option><option>Male</option><option>Non-binary</option></select></label><div class="setup-note"><strong>Still generated</strong><p>Family, finances, home, birthplace, temperament, abilities, health, and future opportunities.</p></div><button class="setup-primary" type="submit">Create this life</button><button class="setup-secondary" type="button" onclick="LittleDaysStart.choice()">Back</button></form>');document.getElementById("custom-form").onsubmit=function(e){e.preventDefault();var d=new FormData(e.target),f=clean(d.get("first")),l=clean(d.get("last"));if(!f||!l)return;begin("custom",{first:f,last:l,sex:d.get("sex")})}}
  function customize(life,d){life.character.firstName=d.first;life.character.lastName=d.last;life.character.sex=d.sex;life.household.name="The "+d.last+" Family Home";life.people.forEach(function(p){if(["guardian","secondGuardian","sibling"].indexOf(p.role)>=0){var a=p.name.split(/\s+/);a[a.length-1]=d.last;p.name=a.join(" ")}})}
  function date(life){return["January","February","March","April","May","June","July","August","September","October","November","December"][life.date.month]+" "+life.date.day+", "+life.date.year}
  function intro(life){var g=[],sib=null,gm=null;life.people.forEach(function(p){if(p.role==="guardian"||p.role==="secondGuardian")g.push(p.name);if(p.role==="sibling")sib=p;if(p.role==="grandmother")gm=p});var family=g.length?"Your home is shared with "+g.join(" and ")+".":"Your household is already taking shape around you.";if(sib)family+=" You have a sibling, "+sib.name+".";if(gm)family+=" "+gm.name+" is part of your family world too.";var line=life.startMode==="custom"?"You chose your character. You did not choose the circumstances waiting for them.":"You did not choose who you would be or the circumstances waiting for you.";shell('<div class="birth-intro"><p class="brand">Little Days</p><p class="birth-kicker">A new life</p><h1>You were born.</h1><p class="birth-date">'+date(life)+'</p><div class="birth-rule"></div><p class="birth-copy">Your name is <strong>'+life.character.firstName+' '+life.character.lastName+'</strong>. You were born in '+life.character.birthplace+'.</p><p class="birth-copy">You begin life in a '+life.household.housing.toLowerCase()+' in '+life.household.city+'. '+family+'</p><p class="birth-copy">Money in the household is <strong>'+life.household.financeBand.toLowerCase()+'</strong>. The neighborhood is '+life.household.neighborhood.toLowerCase()+'.</p><div class="birth-rule"></div><p class="birth-philosophy">'+line+'</p><p class="birth-philosophy">You will discover the rest by living.</p><button class="setup-primary" onclick="LittleDaysStart.play()">Begin</button></div>')}
  function begin(mode,data){var life=makeLife();if(mode==="custom")customize(life,data);life.startMode=mode;life.introPending=true;save(life);intro(life)}
  function normalize(life){if(!life||life.character.ageMonths>=36||life.currentEventId!=="family_evening")return;life.resolution=null;life.currentEventId=life.character.ageMonths<12?"held_after_crying":life.character.ageMonths<24?"cupboard_discovery":"playground_edge"}
  function error(msg){shell('<div class="setup-header"><p class="brand">Little Days</p><h1>Something didn\'t load.</h1><p>'+msg+'</p></div><button class="setup-primary" onclick="location.reload()">Reload</button>')}
  function play(){var life=read();if(!life){choice();return}life.introPending=false;normalize(life);save(life);shell('<div class="setup-header"><p class="brand">Little Days</p><h1>Opening your life…</h1><p>One moment.</p></div>');var done=false;import("./app.js?v=11").then(function(game){if(game&&typeof game.initializeApp==="function")game.initializeApp();done=true}).catch(function(){done=true;error("The life was saved, but the game screen could not open. Reload once to try again.")});setTimeout(function(){if(!done||!document.querySelector(".screen"))error("The game took too long to open. Your life is saved, so reloading will not erase it.")},4000)}
  window.LittleDaysStart={random:function(){begin("random")},custom:custom,choice:choice,play:play};
  document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-new-life]");if(!b)return;e.preventDefault();e.stopPropagation();if(confirm("Begin a different life? Your current childhood will be replaced.")){localStorage.removeItem(KEY);choice();scrollTo(0,0)}},true);
  var existing=read();if(existing){normalize(existing);save(existing);existing.introPending?intro(existing):play()}else choice();
})();
</script>
</body>
</html>
