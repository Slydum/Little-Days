    {city:"Davao City",country:"Philippines",neighborhood:"Residential",housing:"Small family house"}

  function rng(seed){var v=seed>>>0;return function(){v=(v*1664525+1013904223)>>>0;return v/4294967296}}

  function rel(r,role,name,age,intro,label,sex,family){return{id:role+"-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-"),role:role,name:name,age:age,introducedAtMonths:intro||0,relationshipLabel:label||role,sex:sex||null,closeness:n(r,48,72),trust:n(r,48,72),affection:n(r,55,78),conflict:n(r,5,20),familiarity:n(r,50,72),lastInteractionAtMonths:intro||0,history:[],family:family||{},npc:{outsideStress:n(r,20,48),availability:n(r,58,82),socialWorld:n(r,28,64),currentThread:"",lastChangedAtMonths:0}}}

  function buildFamily(r,last){
    var people=[],story="",roll=r(),scenario="together",maternalLast=differentLast(r,last),motherAge=n(r,23,38),fatherAge=n(r,24,40),motherName=pick(r,WOMEN)+" "+maternalLast,fatherName=pick(r,MEN)+" "+last,mother=null,father=null;

  function makeLife(){
    var seed=(Date.now()^Math.floor(Math.random()*0x7fffffff))>>>0,r=rng(seed||1),first=pick(r,FIRST),last=pick(r,LAST),place=pick(r,PLACES),financeRoll=r(),band=financeRoll<.28?"Tight":financeRoll<.76?"Getting by":"Comfortable",month=n(r,0,11),family=buildFamily(r,last);

  document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-new-life]");if(!b)return;e.preventDefault();e.stopPropagation();if(confirm("Begin a different life? Your current childhood will be replaced.")){localStorage.removeItem(KEY);choice();scrollTo(0,0)}},true);
