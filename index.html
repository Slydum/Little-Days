<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2e8" />
    <meta name="description" content="Little Days — a quiet, story-first life simulation." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=8" />
    <link rel="stylesheet" href="./setup.css?v=8" />
    <title>Little Days</title>
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite">
      <!-- Render the first screen as real HTML, not a JavaScript loading state.
           bootstrap.js enhances/replaces this once it runs. This means a script or
           cache problem can never strand the player on an eternal Loading screen. -->
      <section class="setup-screen">
        <div class="setup-header">
          <p class="brand">Little Days</p>
          <h1>Begin a life</h1>
          <p>Every life starts with things you choose and things you don't.</p>
        </div>

        <div class="setup-options">
          <button class="setup-option" id="random-life" type="button">
            <strong>Random life</strong>
            <span>Let everything be generated, including your character.</span>
          </button>
          <button class="setup-option" id="custom-life" type="button">
            <strong>Custom character</strong>
            <span>Choose your character's identity. Their family, money, home, birthplace, temperament, and circumstances are still generated.</span>
          </button>
        </div>

        <p class="setup-footnote">You can choose the person. You cannot choose the life waiting for them.</p>
      </section>
    </main>

    <noscript>
      <div style="padding:20px;text-align:center">Little Days needs JavaScript enabled to begin a life.</div>
    </noscript>

    <!-- No service-worker manipulation here. The previous recovery code could throw
         before startup on some Safari versions. Keep the entrypoint deliberately dull. -->
    <script src="./bootstrap.js?v=8"></script>
    <script>
      window.setTimeout(function () {
        if (window.__littleDaysBooted) return;
        var note = document.createElement("p");
        note.style.cssText = "margin:18px auto 0;max-width:330px;text-align:center;color:#9b665d;font-size:12px;line-height:1.5";
        note.textContent = "The game script did not start. Reload this page once. If this message remains, Safari is serving an older cached file.";
        var screen = document.querySelector(".setup-screen");
        if (screen && !document.getElementById("startup-failed-note")) {
          note.id = "startup-failed-note";
          screen.appendChild(note);
        }
      }, 2000);
    </script>
  </body>
</html>
